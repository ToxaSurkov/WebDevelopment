<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Интерактивная лаборатория: красивый UI ≠ удобный UX</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9eef1;color:#223944;font:15px/1.48 system-ui,-apple-system,'Segoe UI',sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #147788;outline-offset:3px}
.lab{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:16px max(20px,calc((100vw - 1250px)/2));background:#142d3a;color:white}.lab-title{font-size:19px;font-weight:750}.lab-subtitle{display:block;font-size:12px;color:#b3ccd7;margin-top:3px}.tools{display:flex;gap:8px;flex-wrap:wrap}.tools button{border:1px solid #64818d;background:#213e4d;color:#fff;border-radius:7px;padding:8px 11px;font-size:13px}.tools button[aria-pressed=true]{background:#fff;color:#173647;border-color:#fff}
.caption{max-width:1190px;margin:18px auto 12px;color:#466271;padding:0 14px}.preview{max-width:1190px;margin:auto;padding:0 14px 52px}.preview.mobile{max-width:435px}.viewport{container-type:inline-size;min-height:600px;background:#fff;border:1px solid #d4e0e5;border-radius:12px;overflow:hidden;box-shadow:0 14px 42px #263e4b16}
/* Shared professional visual design: the variants differ in interaction architecture, not aesthetics. */
.site{background:#fff;min-height:600px}.bar{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;padding:20px 29px;border-bottom:1px solid #e2e9ec}.logo{font-weight:750;font-size:18px;letter-spacing:-.35px}.logo b{display:inline-grid;place-items:center;border-radius:7px;background:#096d7a;color:#fff;width:34px;height:34px;margin-right:10px}.nav{font-size:13px;color:#607b89}.main{max-width:1090px;padding:28px 29px 44px;margin:0 auto}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:#117786;font-weight:750}.main h1{font-size:29px;letter-spacing:-.7px;line-height:1.16;margin:8px 0 11px}.lead{margin:0;color:#657c89;font-size:14px}.section-label{font-size:16px;font-weight:750;margin:26px 0 12px}.filters{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(0,.85fr) auto;gap:12px;align-items:end;background:#f4f9fa;border:1px solid #dbe9ec;border-radius:10px;padding:17px}.field{display:grid;gap:7px;font-size:12px;font-weight:680;color:#3f5968}.field input,.field select{background:white;border:1px solid #c5d5dc;border-radius:6px;width:100%;min-width:0;padding:10px 12px;color:#243d4b}.reset{border:1px solid #b6d1da;color:#176879;background:#fff;border-radius:6px;padding:10px 14px;white-space:nowrap}.results-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin:27px 0 15px}.results-head h2{font-size:18px;margin:0}.count{font-size:13px;color:#52727e}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}article{display:flex;flex-direction:column;gap:15px;min-height:180px;padding:19px;background:white;border:1px solid #e0e8ec;border-radius:9px}article .meta{display:flex;align-items:center;gap:10px;font-size:12px;color:#607c86}article .tag{border-radius:5px;padding:3px 8px;background:#e9f3f3;color:#176a77}article strong{font-size:17px;line-height:1.35}article .more{color:#147386;font-size:12px;font-weight:680;margin-top:auto}.empty{padding:39px 20px;border:1px dashed #c8dce1;background:#fafcfc;border-radius:9px;text-align:center}.empty h2{font-size:20px;margin:0 0 10px}.empty p{color:#647c88;margin:0 0 18px}.empty button{border:0;background:#086c7b;color:#fff;border-radius:7px;padding:10px 18px}
/* Variant A: credible editorial design, but browsing is prioritized over goal-oriented search. */
.a .hero{padding:31px;background:linear-gradient(125deg,#e9f3f3,#f2f5f8);border:1px solid #dbe7eb;border-radius:11px;margin:0 0 18px}.a .hero h1{font-size:29px}.a .hero p{margin:7px 0 0;color:#57737d}.a .featured{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;margin-top:16px}.a .featured div{border:1px solid #dfe8eb;border-radius:9px;padding:16px;background:#fff;min-height:99px;display:flex;flex-direction:column;justify-content:space-between}.a .featured strong{font-size:14px}.a .featured small{font-size:12px;color:#768b95}.a .search-block{border-top:1px solid #e6edef;padding-top:22px;margin-top:17px}.a .search-block h2{font-size:16px;margin:0 0 12px}.a .primary-search{display:grid;grid-template-columns:1fr auto;align-items:end;gap:12px}.a .filters{display:block;padding:0;background:transparent;border:0}.a .primary-search .reset{background:#0e7180;color:#fff;border-color:#0e7180}.a details{margin:17px 0 0;padding:12px 15px;background:#f4f8fa;border:1px solid #e0e9ee;border-radius:8px}.a details summary{cursor:pointer;font-size:13px;font-weight:650;color:#486b79}.a details .extra{display:flex;align-items:end;gap:13px;margin-top:14px}.a details .field{flex:1}.a details .link-reset{background:#fff;color:#20687c;border:1px solid #bad5dc;border-radius:6px;padding:10px 13px}.a .results-head{margin-top:23px}.a .count{font-size:13px;color:#607c86}.a .empty{background:#fafcfc;border:1px solid #e1eaee;padding:34px 20px}.a .empty p{display:none}.a .empty button{display:none}
@container (max-width:750px){.bar{padding:16px 19px}.main{padding:19px}.filters{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.a .featured{grid-template-columns:1fr}.a .hero{padding:23px}.a .hero h1{font-size:24px}.a .primary-search{grid-template-columns:1fr}.a details .extra{flex-direction:column;align-items:stretch}}
@container (max-width:480px){.grid{grid-template-columns:1fr}.main h1{font-size:23px}.bar{gap:9px}.results-head{flex-wrap:wrap}.a .hero{padding:18px}}
</style>
</head><body>
<header class="lab"><div><span class="lab-title">UI-лаборатория: две хорошие визуальные работы, разный UX</span><span class="lab-subtitle">Один набор публикаций. Цель — найти запись по теме и году.</span></div><div class="tools"><button id="bad" aria-pressed="false">Вариант А</button><button id="good" aria-pressed="true">Вариант Б</button><button id="desktop" aria-pressed="true">Широкий экран</button><button id="mobile" aria-pressed="false">Узкий экран</button></div></header>
<p class="caption" id="caption">Сравните, сколько действий требуется, чтобы найти публикацию за 2025 год.</p>
<div class="preview" id="preview"><div class="viewport" id="viewport"></div></div>
<script>
const DATA=[{title:'Как проектируют интерфейсы научных каталогов',year:2026,topic:'UX'},{title:'Визуализация результатов исследований',year:2025,topic:'Данные'},{title:'Обзор методов анализа текста',year:2026,topic:'NLP'},{title:'Интерактивные панели для аналитики',year:2024,topic:'UX'},{title:'Метрики качества поисковых систем',year:2025,topic:'NLP'},{title:'Обнаружение аномалий в табличных данных',year:2024,topic:'Данные'}];
let state={mode:'good',width:'desktop',query:'',year:'all',openExtra:false};const byId=id=>document.getElementById(id);const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yearInput=()=>`<label class="field">Год публикации<select id="year"><option value="all">Все годы</option>${[2026,2025,2024].map(y=>`<option value="${y}" ${state.year===String(y)?'selected':''}>${y}</option>`).join('')}</select></label>`;
const queryInput=()=>`<label class="field">Поиск по названию<input id="q" value="${safe(state.query)}" placeholder="Например: визуализация" autocomplete="off"></label>`;
const controls=()=>{for(const v of ['bad','good'])byId(v).setAttribute('aria-pressed',String(state.mode===v));for(const v of ['mobile','desktop'])byId(v).setAttribute('aria-pressed',String(state.width===v));byId('preview').classList.toggle('mobile',state.width==='mobile')};
function render(){controls();let a=state.mode==='bad';let list=DATA.filter(x=>x.title.toLowerCase().includes(state.query.trim().toLowerCase())&&(state.year==='all'||String(x.year)===state.year));byId('caption').textContent=a?'Вариант А: аккуратный каталог для изучения подборок, но поиск — второстепенное действие, а фильтр года спрятан.':'Вариант Б: поиск и год видны сразу, количество результатов заметно, для пустой выдачи есть следующий шаг.';
const header=`<div class="bar"><div class="logo"><b>R</b>Research Atlas</div><div class="nav">Каталог · Обзоры · Справка</div></div>`;
const first=a?`<div class="hero"><span class="eyebrow">Исследовательская библиотека</span><h1>Публикации и направления</h1><p>Изучайте новые темы, подборки и материалы.</p></div><div class="section-label">Рекомендуем изучить</div><div class="featured"><div><strong>Визуальная аналитика</strong><small>Подборка недели</small></div><div><strong>Текстовые модели</strong><small>Новые методы</small></div><div><strong>Методы исследования</strong><small>Читать обзор</small></div></div><div class="search-block"><h2>Поиск в каталоге</h2><div class="primary-search">${queryInput()}<button class="reset" id="search-cta">Искать</button></div><details id="extra" ${state.openExtra?'open':''}><summary>Дополнительные параметры</summary><div class="extra">${yearInput()}<button id="reset" class="link-reset">Сбросить</button></div></details></div>`:`<span class="eyebrow">Каталог исследований</span><h1>Найдите нужную публикацию</h1><p class="lead">Поиск по теме и году. Все записи созданы для учебной демонстрации.</p><div class="section-label">Поиск и фильтры</div><div class="filters">${queryInput()}${yearInput()}<button class="reset" id="reset">Сбросить</button></div>`;
const cards=list.length?`<div class="grid">${list.map(i=>`<article><div class="meta"><span class="tag">${safe(i.topic)}</span><span>${i.year}</span></div><strong>${safe(i.title)}</strong><span class="more">Подробнее</span></article>`).join('')}</div>`:`<div class="empty"><h2>Ничего не найдено</h2><p>Измените запрос или сбросьте фильтры.</p><button id="reset-empty">Сбросить фильтры</button></div>`;
byId('viewport').innerHTML=`<div class="site ${a?'a':'b'}">${header}<main class="main">${first}<div class="results-head"><h2>${a?'Материалы каталога':'Результаты поиска'}</h2><span class="count">${a?`Всего: ${list.length}`:`Найдено: ${list.length}`}</span></div>${cards}</main></div>`;
let q=byId('q');q.addEventListener('input',e=>{state.query=e.target.value;let cursor=e.target.selectionStart;render();q=byId('q');q.focus();q.setSelectionRange(cursor,cursor)});
let year=byId('year');year?.addEventListener('change',e=>{state.year=e.target.value;render()});let clear=()=>{state.query='';state.year='all';render()};byId('reset')?.addEventListener('click',clear);byId('reset-empty')?.addEventListener('click',clear);byId('search-cta')?.addEventListener('click',()=>byId('q').focus());byId('extra')?.addEventListener('toggle',e=>{state.openExtra=e.target.open});
}
for(const v of ['good','bad'])byId(v).addEventListener('click',()=>{state.mode=v;render()});for(const v of ['desktop','mobile'])byId(v).addEventListener('click',()=>{state.width=v;render()});render();
</script></body></html>
